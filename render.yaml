# Render Blueprint — lets you deploy via "New +" -> "Blueprint" in the Render
# dashboard instead of manually filling in build/start commands.
#
# This deploys as a free Web Service (plan: free). It only works as
# "always on" if you also set up an external pinger (see README.md) to hit
# the health endpoint every ~10 minutes — otherwise Render spins it down
# after 15 minutes of no HTTP traffic, same as any other free web service.
services:
  - type: web
    name: motopark-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m motopark_bot.main
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LTA_ACCOUNT_KEY
        sync: false
      # Optional: enables /check with a 6-digit postal code (e.g.
      # `/check 238801`). Leave blank in the Render dashboard and the bot
      # still works fine - postal-code queries just get a "not set up"
      # reply instead of results. Register a free account at
      # https://www.onemap.gov.sg to get these - see README.md.
      - key: ONEMAP_EMAIL
        sync: false
      - key: ONEMAP_PASSWORD
        sync: false
